name: Auto Optimize Bird Photos

on:
  push:
    paths:
      - 'images/birds/**'
      - 'birds.json' # Now it will also trigger if you update your JSON database!
  workflow_dispatch: # <--- THIS adds your manual "Run workflow" button!

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-module-cache: true
          python-version: '3.x'

      - name: Install Image Processor
        run: pip install Pillow

      - name: Compress Masters and Generate Thumbnails
        run: |
          python - <<EOF
          import os
          from PIL import Image

          bird_dir = "images/birds"
          thumb_dir = os.path.join(bird_dir, "thumbs")
          os.makedirs(thumb_dir, exist_ok=True)

          for filename in os.listdir(bird_dir):
              if os.path.isdir(os.path.join(bird_dir, filename)):
                  continue
                  
              if filename.lower().endswith(('.jpg', '.jpeg', '.png')):
                  img_path = os.path.join(bird_dir, filename)
                  thumb_path = os.path.join(thumb_dir, filename)
                  
                  with Image.open(img_path) as img:
                      if os.path.getsize(img_path) > 200000:
                          img.save(img_path, "JPEG", quality=80, optimize=True)
                          print(f"Optimized master: {filename}")
                      
                      if not os.path.exists(thumb_path):
                          img.thumbnail((400, 400))
                          img.save(thumb_path, "JPEG", quality=75, optimize=True)
                          print(f"Generated thumbnail for: {filename}")
          EOF

      - name: Commit Optimized Images Automatically
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated image optimization and thumbnail generation [skip ci]"