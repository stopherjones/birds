name: Auto Optimize Bird Photos

on:
  push:
    paths:
      - 'images/birds/**'
      - 'birds.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-module-cache: true
          python-version: '3.x'

      - name: Install Image Processor
        run: pip install Pillow

      - name: Process Database and Assets
        run: |
          python - <<EOF
          import json
          import os
          import re

          json_path = 'birds.json'
          bird_dir = 'images/birds'
          thumb_dir = os.path.join(bird_dir, 'thumbs')

          if os.path.exists(json_path):
              with open(json_path, 'r') as f:
                  data = json.load(f)
          else:
              print("Critical Error: birds.json data structure not found!")
              exit(1)

          birds_list = data if isinstance(data, list) else data.get('birds', [])
          json_updated = False
          valid_extensions = ('.jpg', '.jpeg', '.png', '.webp')

          def normalise(text):
              if not text:
                  return ''
              text = text.lower()
              text = re.sub(r"['/]", "", text)
              text = re.sub(r"[\s\-]+", "_", text)
              return text.strip('_')

          def create_other_bird_entry(bird_name, location):
              safe_name = bird_name.strip()
              safe_location = (location or 'Location not recorded').strip() or 'Location not recorded'
              base_code = normalise(f"{safe_name}__{safe_location}")

              candidate = base_code
              suffix = 1
              while any(normalise(b.get('code', '')) == candidate for b in birds_list):
                  candidate = f"{base_code}_{suffix}"
                  suffix += 1

              new_bird = {
                  'name': safe_name,
                  'code': candidate,
                  'seen': True,
                  'where_seen': safe_location,
                  'photos': [],
                  'url': '',
                  'is_other_bird': True
              }
              birds_list.append(new_bird)
              return new_bird

          for filename in os.listdir(bird_dir):
              if os.path.isdir(os.path.join(bird_dir, filename)) or not filename.lower().endswith(valid_extensions):
                  continue
                  
              raw_name, ext = os.path.splitext(filename)
              
              # 1. SPECIAL MODE: Suffix flag present (e.g., Great Black-backed Gull__Bryher, Isles of Scilly.jpg)
              if '__' in raw_name:
                  parts = raw_name.split('__', 1)
                  bird_input = parts[0].strip()
                  provided_location = parts[1].strip()

                  target = normalise(bird_input)
                  bird = next((b for b in birds_list if normalise(b.get('code')) == target or normalise(b.get('name')) == target), None)

                  if bird:
                      canonical_code = bird.get('code')
                      final_filename = f"{canonical_code}{ext.lower()}"
                      dest_image_path = os.path.join(bird_dir, final_filename)
                      dest_thumb_path = os.path.join(thumb_dir, final_filename)

                      if os.path.exists(dest_image_path) and dest_image_path != os.path.join(bird_dir, filename):
                          os.remove(dest_image_path)
                      if os.path.exists(dest_thumb_path):
                          os.remove(dest_thumb_path)

                      bird['seen'] = True
                      bird['where_seen'] = provided_location or bird.get('where_seen') or 'Location not recorded'
                      print(f"Mode A: Updated {canonical_code} with location: {bird['where_seen']}")

                      os.rename(os.path.join(bird_dir, filename), dest_image_path)
                      json_updated = True
                  else:
                      bird = create_other_bird_entry(bird_input, provided_location)
                      final_filename = f"{bird['code']}{ext.lower()}"
                      dest_image_path = os.path.join(bird_dir, final_filename)
                      if os.path.exists(dest_image_path):
                          os.remove(dest_image_path)
                      os.rename(os.path.join(bird_dir, filename), dest_image_path)
                      print(f"Mode A-Other: Added new other bird entry '{bird_input}' at '{bird['where_seen']}'")
                      json_updated = True

              # 2. DIRECT MODE: Clean filename dropped directly (e.g., Great Black-backed Gull.jpg)
              else:
                  bird_input = raw_name.strip()
                  target = normalise(bird_input)
                  bird = next((b for b in birds_list if normalise(b.get('code')) == target or normalise(b.get('name')) == target), None)
                  
                  if bird:
                      canonical_code = bird.get('code')
                      final_filename = f"{canonical_code}{ext.lower()}"
                      dest_image_path = os.path.join(bird_dir, final_filename)

                      if filename != final_filename:
                          if os.path.exists(dest_image_path):
                              os.remove(dest_image_path)
                          os.rename(os.path.join(bird_dir, filename), dest_image_path)

                      if not bird.get('seen'):
                          dest_thumb_path = os.path.join(thumb_dir, f"{canonical_code}{ext.lower()}")
                          if os.path.exists(dest_thumb_path):
                              os.remove(dest_thumb_path)
                          
                          bird['seen'] = True
                          bird['where_seen'] = "Location not recorded"
                          print(f"Mode C: Direct upload activated {canonical_code}")
                      
                      json_updated = True
                  else:
                      bird = create_other_bird_entry(bird_input, 'Location not recorded')
                      final_filename = f"{bird['code']}{ext.lower()}"
                      dest_image_path = os.path.join(bird_dir, final_filename)
                      if os.path.exists(dest_image_path):
                          os.remove(dest_image_path)
                      os.rename(os.path.join(bird_dir, filename), dest_image_path)
                      print(f"Mode C-Other: Added new other bird entry '{bird_input}'")
                      json_updated = True

          if json_updated:
              with open(json_path, 'w') as f:
                  json.dump(data, f, indent=4)
              print("Database records synchronized successfully.")
          EOF

      - name: Convert Masters and Generate WebP Thumbnails
        run: |
          python - <<EOF
          import os
          from PIL import Image

          bird_dir = "images/birds"
          thumb_dir = os.path.join(bird_dir, "thumbs")
          os.makedirs(thumb_dir, exist_ok=True)

          valid_extensions = ('.jpg', '.jpeg', '.png', '.webp')

          for filename in os.listdir(bird_dir):
              if os.path.isdir(os.path.join(bird_dir, filename)):
                  continue
                  
              if filename.lower().endswith(valid_extensions):
                  img_path = os.path.join(bird_dir, filename)
                  raw_name, ext = os.path.splitext(filename)
                  
                  # Standardise output to .webp
                  webp_filename = f"{raw_name}.webp"
                  webp_img_path = os.path.join(bird_dir, webp_filename)
                  thumb_path = os.path.join(thumb_dir, webp_filename)
                  
                  with Image.open(img_path) as img:
                      # Convert and save master as WebP
                      img.save(webp_img_path, "WEBP", quality=80, method=4)
                      print(f"Converted/Optimized master to WebP: {webp_filename}")
                      
                      # Generate WebP thumbnail
                      img.thumbnail((400, 400))
                      img.save(thumb_path, "WEBP", quality=75, method=4)
                      print(f"Generated WebP thumbnail for: {webp_filename}")
                  
                  # Clean up old extension files if they were uploaded as .jpg/.png
                  if img_path != webp_img_path and os.path.exists(img_path):
                      os.remove(img_path)
          EOF

      - name: Commit Optimized Images Automatically
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated WebP conversion, asset optimization, and database sync [skip ci]"
