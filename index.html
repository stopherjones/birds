<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK Birds</title>
    <link rel="icon" href="images/bird-icon.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <meta name="google-site-verification" content="z9n0lhtaop9VH_-yYuA5LYSZueR5IFPOXtmz3ffvnMw" />
</head>

<body>
    <div class="top-links">
        <a target="_blank" href="https://github.com/stopherjones/birds/upload/main/images/birds" class="top-link">Add
            new photo</a>
    </div>

    <h1 class="main-title">UK Birds</h1>

    <div class="stat-display">
        <span id="statText">0 species from the 0 on the<a href="https://www.rspb.org.uk/birds-and-wildlife/a-z"
                target="_blank" rel="noopener noreferrer">RSPB A-Z list of UK Birds</a></span>
    </div>

    <p class="subtitle">Click on a bird card for larger photos, location and RSPB link.</p>

    <nav class="filter-bar index-bar">
        <div class="filter-row row-top">
            <div class="filter-group content-type">
                <span class="control-label">Sighting Status</span>
                <div class="checkbox-group">
                    <label>Seen <input type="checkbox" id="filterSeen" checked></label>
                    <label>Unseen <input type="checkbox" id="filterUnseen" checked></label>
                </div>
            </div>


            <div class="filter-group search">
                <label for="searchInput">Search</label>
                <input type="text" id="searchInput" placeholder="Find a species...">
            </div>

    </nav>

    <div id="gallery" class="gallery"></div>

    <script src="script.js"></script>
    <footer style="text-align: center;">
    <p>Open-source personal web project built by me, Chris Jones (stopherjones). For more information, see <a href="https://stopherjones.github.io/about.html">About Me</a></p>
    </footer>
</body>

</html>
