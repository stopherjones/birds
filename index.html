<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birding Life List</title>
    <link rel="icon" href="images/bird-icon.png" type="image/png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 class="main-title">Birding Life List</h1>

    <div class="stat-display">
        <span id="statText">0 species seen out of 0 total tracked species</span>
    </div>

    <p class="subtitle">Click on a bird card to view high-resolution photos, identification metrics, and encounter logs.</p>

    <nav class="filter-bar index-bar">
        <div class="filter-row row-top">
            <div class="filter-group content-type">
                <span class="control-label">Sighting Status</span>
                <div class="checkbox-group">
                    <label>Seen <input type="checkbox" id="filterSeen" checked></label>
                    <label>Unseen <input type="checkbox" id="filterUnseen" checked></label>
                </div>
            </div>

            <div class="filter-group type-picker">
                <label for="typeFilter">Bird Type</label>
                <select id="typeFilter">
                    <option value="all">All Types</option>
                    </select>
            </div>
        </div>

        <div class="filter-row row-bottom">
            <div class="filter-group search">
                <label for="searchInput">Search</label>
                <input type="text" id="searchInput" placeholder="Find a species...">
            </div>
        </div>
    </nav>

    <div id="gallery" class="gallery"></div>

    <script src="script.js"></script>
</body>
</html>
